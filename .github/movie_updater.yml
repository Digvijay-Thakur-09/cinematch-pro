name: Weekly TMDB Data Pipeline

# When should this run?
on:
  schedule:
    - cron: '0 0 * * 0' # Runs automatically every Sunday at midnight
  workflow_dispatch: # Adds a manual "Run Now" button on GitHub so you can test it!

# What should it do?
jobs:
  update-data:
    runs-on: ubuntu-latest # Uses a US-based Linux server (No ISP Blocks!)

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Same version you are using locally

      - name: 📦 Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests scikit-learn numpy joblib

      - name: 🚀 Run the Master Data Pipeline
        run: python update_data.py

      - name: 💾 Commit and Push Updated Data
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "🤖 Automated Weekly Data & Model Update" || echo "No changes to commit"
          git push